<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1917">
<title>墨道 · Kanji Path</title>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#f6f3ed;color:#1c1917;
    display:grid;place-items:center;min-height:100dvh}
  .boot{text-align:center;padding:2rem}
  .boot .jp{font-size:2rem;letter-spacing:.08em}
  .spin{width:28px;height:28px;border:3px solid #e7e5e0;border-top-color:#9f1239;
    border-radius:50%;margin:1rem auto;animation:s 0.8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="boot">
  <div class="jp">墨道</div>
  <div>Loading Kanji Path…</div>
  <div class="spin" aria-hidden="true"></div>
</div>
<script>
(async function () {
  const GOOD = "b8aecc948014fba614239275611ddc3851656ca6";
  const urls = [
    "https://cdn.jsdelivr.net/gh/bourne2398/kanji-path@" + GOOD + "/public/index.html",
    "https://raw.githubusercontent.com/bourne2398/kanji-path/" + GOOD + "/public/index.html"
  ];
  let html = null;
  for (const u of urls) {
    try {
      const r = await fetch(u, { cache: "no-store" });
      if (r.ok) { html = await r.text(); break; }
    } catch (e) {}
  }
  if (!html) {
    document.querySelector(".boot").innerHTML =
      "<p>Could not load the app shell.</p><p><a href=\"https://github.com/bourne2398/kanji-path\">Open repo</a> and restore public/index.html from commit " + GOOD + ".</p>";
    return;
  }
  html = html.replace('content=\"#9f1239\"', 'content=\"#1c1917\"');
  if (!html.includes("Noto+Serif+JP")) {
    html = html.replace(
      "family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3",
      "family=Cormorant+Garamond:wght@500;600;700&family=Noto+Serif+JP:wght@500;600;700&family=Source+Sans+3"
    );
  }
  document.open();
  document.write(html);
  document.close();
})();
</script>
</body>
</html>
