<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1c1917">
<title>Admin · Kanji Path</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f3ed;
    --panel: #fffcf7;
    --text: #1c1917;
    --muted: #78716c;
    --border: #e7e5e0;
    --ink: #1c1917;
    --accent: #9f1239;
    --accent-soft: #fff1f2;
    --indigo: #4338ca;
    --bad: #9f1239;
    --ok: #166534;
    --shadow: 0 4px 24px rgba(28, 25, 23, 0.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Source Sans 3", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(255, 252, 247, 0.92);
    backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header strong {
    font-family: "Cormorant Garamond", serif;
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  header a {
    color: var(--indigo);
    text-decoration: none;
    font-weight: 700;
    font-size: 0.9rem;
  }
  header a:hover { text-decoration: underline; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 1rem;
    padding: 1.25rem 1.35rem;
    margin-bottom: 1rem;
    box-shadow: var(--shadow);
  }
  h1 {
    margin: 0 0 4px;
    font-family: "Cormorant Garamond", serif;
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .muted { color: var(--muted); font-size: 0.9rem; }
  label {
    display: block;
    font-weight: 700;
    margin: 12px 0 6px;
    font-size: 0.88rem;
  }
  input, select {
    width: 100%;
    padding: 12px 14px;
    border-radius: 0.65rem;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    font: inherit;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--indigo);
    box-shadow: 0 0 0 3px rgba(67, 56, 202, 0.12);
  }
  button {
    margin-top: 14px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 0.65rem;
    background: linear-gradient(145deg, var(--accent), #be123c);
    color: #fff;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(159, 18, 57, 0.2);
  }
  button:hover { filter: brightness(1.05); }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    box-shadow: none;
  }
  button.secondary:hover {
    background: #efebe3;
    filter: none;
  }
  .err { color: var(--bad); font-weight: 700; margin-top: 10px; min-height: 1.2em; }
  .ok { color: var(--ok); font-weight: 700; margin-top: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 10px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    background: #eef2ff;
    color: var(--indigo);
    font-size: 0.75rem;
    font-weight: 800;
  }
  .hidden { display: none !important; }
  code {
    font-size: 0.85em;
    background: #efebe3;
    padding: 0.1em 0.35em;
    border-radius: 4px;
  }
</style>
</head>
<body>
<header>
  <strong>墨道 · Admin</strong>
  <a href="/">← App</a>
  <span class="muted" id="who"></span>
  <button class="secondary" id="logoutBtn" style="width:auto;margin:0;padding:8px 14px;margin-left:auto">Log out</button>
</header>
<main>
  <div class="card" id="loginCard">
    <h1>Admin login</h1>
    <p class="muted">Sign in with the admin account created by <code>seed-admin</code>.</p>
    <label>Email</label>
    <input id="email" type="email" autocomplete="username" placeholder="admin@example.com">
    <label>Password</label>
    <input id="password" type="password" autocomplete="current-password">
    <button id="loginBtn">Sign in</button>
    <div class="err" id="loginErr"></div>
  </div>

  <div class="card hidden" id="dashCard">
    <h1>Dashboard</h1>
    <p class="muted" id="healthLine">Checking database…</p>
    <p class="ok" id="createMsg"></p>
  </div>

  <div class="card hidden" id="usersCard">
    <h1>Users</h1>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>ID</th><th>Email</th><th>Name</th><th>Role</th><th>Last login</th></tr></thead>
        <tbody id="usersBody"></tbody>
      </table>
    </div>
  </div>

  <div class="card hidden" id="createCard">
    <h1>Create user</h1>
    <label>Email</label>
    <input id="newEmail" type="email">
    <label>Name</label>
    <input id="newName" type="text">
    <label>Password (min 8)</label>
    <input id="newPass" type="password">
    <label>Role</label>
    <select id="newRole">
      <option value="student">student</option>
      <option value="admin">admin</option>
    </select>
    <button id="createBtn">Create user</button>
    <div class="err" id="createErr"></div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);

async function api(path, opts = {}) {
  const res = await fetch(path, {
    credentials: 'include',
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
    ...opts,
  });
  const data = await res.json().catch(() => ({}));
  return { res, data };
}

function showLoggedIn(user) {
  $('loginCard').classList.add('hidden');
  $('dashCard').classList.remove('hidden');
  $('usersCard').classList.remove('hidden');
  $('createCard').classList.remove('hidden');
  $('who').textContent = user ? `${user.email} (${user.role})` : '';
  loadHealth();
  loadUsers();
}

function showLoggedOut() {
  $('loginCard').classList.remove('hidden');
  $('dashCard').classList.add('hidden');
  $('usersCard').classList.add('hidden');
  $('createCard').classList.add('hidden');
  $('who').textContent = '';
}

async function loadMe() {
  const { data } = await api('/api/auth/me');
  if (data.user && data.user.role === 'admin') {
    showLoggedIn(data.user);
  } else {
    showLoggedOut();
  }
}

async function loadHealth() {
  const { data } = await api('/api/health');
  if (data.ok) {
    $('healthLine').textContent =
      `DB connected · ${Number(data.vocabulary_entries || 0).toLocaleString()} vocabulary rows · ${data.users} users`;
  } else {
    $('healthLine').textContent = 'DB error: ' + (data.error || 'unknown');
  }
}

async function loadUsers() {
  const { res, data } = await api('/api/admin/users');
  if (!res.ok) {
    $('usersBody').innerHTML = `<tr><td colspan="5">${data.error || 'Failed'}</td></tr>`;
    return;
  }
  $('usersBody').innerHTML = (data.users || []).map(u => `
    <tr>
      <td>${u.id}</td>
      <td>${escapeHtml(u.email)}</td>
      <td>${escapeHtml(u.name || '')}</td>
      <td><span class="badge">${escapeHtml(u.role)}</span></td>
      <td>${u.last_login_at ? new Date(u.last_login_at).toLocaleString() : '—'}</td>
    </tr>
  `).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));
}

$('loginBtn').onclick = async () => {
  $('loginErr').textContent = '';
  const email = $('email').value.trim();
  const password = $('password').value;
  const { res, data } = await api('/api/auth/login', {
    method: 'POST',
    body: JSON.stringify({ email, password }),
  });
  if (!res.ok) {
    $('loginErr').textContent = data.error || 'Login failed';
    return;
  }
  if (data.user?.role !== 'admin') {
    $('loginErr').textContent = 'This account is not an admin.';
    await api('/api/auth/logout', { method: 'POST' });
    return;
  }
  showLoggedIn(data.user);
};

$('logoutBtn').onclick = async () => {
  await api('/api/auth/logout', { method: 'POST' });
  showLoggedOut();
};

$('createBtn').onclick = async () => {
  $('createErr').textContent = '';
  $('createMsg').textContent = '';
  const body = {
    email: $('newEmail').value.trim(),
    name: $('newName').value.trim(),
    password: $('newPass').value,
    role: $('newRole').value,
  };
  const { res, data } = await api('/api/admin/users', {
    method: 'POST',
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    $('createErr').textContent = data.error || 'Create failed';
    return;
  }
  $('createMsg').textContent = `Created ${data.user.email} (id ${data.user.id})`;
  $('newEmail').value = '';
  $('newName').value = '';
  $('newPass').value = '';
  loadUsers();
  loadHealth();
};

loadMe();
</script>
</body>
</html>
