<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Admin · Flashcards History</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12141c;--card:#222633;--text:#f0eef5;--muted:#a09aab;
  --accent:#e08aa3;--border:#333848;--ok:#4ade80;--bad:#f87171;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans JP',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.45}
.app{max-width:800px;margin:0 auto;padding:1.2rem 1rem 3rem}
header{margin-bottom:1.2rem}
header h1{font-size:1.35rem;color:var(--accent)}
header p{color:var(--muted);font-size:.88rem;margin-top:.25rem}
a{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1rem;margin-bottom:1rem}
label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:.35rem}
input[type=password],input[type=text]{
  width:100%;padding:.65rem .8rem;border-radius:10px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);font:inherit;min-height:44px;margin-bottom:.7rem;
}
button{
  font:inherit;font-weight:700;padding:.6rem 1.1rem;border-radius:10px;border:none;
  background:var(--accent);color:#1a0a12;cursor:pointer;min-height:42px;
}
button.secondary{background:transparent;border:1px solid var(--border);color:var(--text)}
button.danger{background:var(--bad);color:#fff}
button:disabled{opacity:.45}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.status{font-size:.85rem;color:var(--muted);margin-top:.5rem;min-height:1.3em}
.item{
  border:1px solid var(--border);border-radius:12px;padding:.75rem .85rem;margin-bottom:.55rem;
  background:rgba(0,0,0,.2);
}
.item .top{display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap;align-items:center}
.item .nick{font-weight:700}
.item .pct{font-weight:700}
.item .pct.good{color:var(--ok)}
.item .pct.mid{color:#c9a227}
.item .pct.low{color:var(--bad)}
.item .meta{font-size:.78rem;color:var(--muted);margin-top:.3rem;line-height:1.4}
.item .actions{margin-top:.5rem}
.empty{text-align:center;padding:1.5rem;color:var(--muted)}
#adminPanel{display:none}
#loginPanel{display:block}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Admin · History</h1>
    <p><a href="/">← Back to flashcards</a> · Only admins can delete. Everyone can view history on the main app.</p>
  </header>

  <div class="card" id="loginPanel">
    <label for="pw">Admin password</label>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password"/>
    <div class="row">
      <button type="button" id="loginBtn">Log in</button>
    </div>
    <div class="status" id="loginStatus"></div>
  </div>

  <div id="adminPanel">
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <strong>Logged in as admin</strong>
        <div class="row">
          <button type="button" class="secondary" id="refreshBtn">Refresh</button>
          <button type="button" class="danger" id="clearAllBtn">Delete all</button>
          <button type="button" class="secondary" id="logoutBtn">Log out</button>
        </div>
      </div>
      <div class="status" id="adminStatus"></div>
    </div>
    <div id="list"></div>
  </div>
</div>
<script>
const TOKEN_KEY="jp_flash_admin_token";
let token=sessionStorage.getItem(TOKEN_KEY)||"";

async function api(path, opts={}){
  const headers=Object.assign({"Content-Type":"application/json"}, opts.headers||{});
  if(token) headers["Authorization"]="Bearer "+token;
  const res=await fetch(path, Object.assign({}, opts, {headers}));
  const data=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error||res.statusText);
  return data;
}

function showLoggedIn(on){
  document.getElementById("loginPanel").style.display=on?"none":"block";
  document.getElementById("adminPanel").style.display=on?"block":"none";
}

async function login(){
  const pw=document.getElementById("pw").value;
  const st=document.getElementById("loginStatus");
  st.textContent="…";
  try{
    const data=await api("/api/admin/login",{method:"POST",body:JSON.stringify({password:pw})});
    token=data.token;
    sessionStorage.setItem(TOKEN_KEY, token);
    st.textContent="";
    showLoggedIn(true);
    loadList();
  }catch(e){
    st.textContent=e.message||"Login failed";
  }
}

async function logout(){
  try{await api("/api/admin/logout",{method:"POST"});}catch(e){}
  token="";
  sessionStorage.removeItem(TOKEN_KEY);
  showLoggedIn(false);
}

async function loadList(){
  const list=document.getElementById("list");
  const st=document.getElementById("adminStatus");
  st.textContent="Loading…";
  try{
    const rows=await api("/api/scores?limit=200");
    st.textContent=rows.length+" entries";
    if(!rows.length){
      list.innerHTML='<div class="empty">No history yet.</div>';
      return;
    }
    list.innerHTML=rows.map(h=>{
      const cls=h.grade==="A"?"good":h.grade==="F"?"low":(h.pct>=80?"good":h.pct>=50?"mid":"low");
      const when=h.when?new Date(h.when).toLocaleString():"";
      const lessons=h.lessons==="all"?"All lessons":(h.lessons||"—");
      const dir=h.dir==="en-jp"?"EN → JP":"JP → EN";
      return `<div class="item" data-id="${h.id}">
        <div class="top">
          <span class="nick">${escapeHtml(h.nick)}</span>
          <span class="pct ${cls}">Grade ${escapeHtml(h.grade||"—")}</span>
        </div>
        <div class="meta">Grade ${escapeHtml(h.grade||"—")} · Attempt ${h.attempts||1} · Score ${h.pct||0}%<br/>✅ ${h.right||0} · ❌ ${h.wrong||0} · ${h.total||0} cards · ${escapeHtml(String(lessons))} · ${dir}<br/>${escapeHtml(when)} · id #${h.id}</div>
        <div class="actions"><button type="button" class="danger del-one" data-id="${h.id}">Delete</button></div>
      </div>`;
    }).join("");
    list.querySelectorAll(".del-one").forEach(btn=>{
      btn.addEventListener("click",()=>deleteOne(parseInt(btn.dataset.id,10)));
    });
  }catch(e){
    st.textContent=e.message;
    if(String(e.message).toLowerCase().includes("unauthorized")){
      logout();
    }
  }
}

async function deleteOne(id){
  if(!confirm("Delete entry #"+id+"?"))return;
  try{
    await api("/api/scores/"+id,{method:"DELETE"});
    loadList();
  }catch(e){
    alert(e.message);
  }
}

async function clearAll(){
  if(!confirm("Delete ALL history? This cannot be undone."))return;
  try{
    await api("/api/scores",{method:"DELETE"});
    loadList();
  }catch(e){
    alert(e.message);
  }
}

function escapeHtml(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

document.getElementById("loginBtn").addEventListener("click",login);
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")login();});
document.getElementById("logoutBtn").addEventListener("click",logout);
document.getElementById("refreshBtn").addEventListener("click",loadList);
document.getElementById("clearAllBtn").addEventListener("click",clearAll);

if(token){
  showLoggedIn(true);
  loadList();
}
</script>
</body>
</html>
